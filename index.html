<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: file:; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Screen Watermark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container" tabindex="0">
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Watermark controls">
      <button id="select-image-btn" class="icon-btn" type="button" title="Select image" aria-label="Select image">🖼️</button>

      <label class="opacity" title="Opacity">
        <span class="opacity-label">Opacity</span>
        <input type="range" id="opacity-slider" min="0.05" max="1" step="0.01" aria-label="Opacity slider">
        <span id="opacity-value" class="opacity-value" aria-hidden="true">100%</span>
      </label>

      <button id="lock-btn" class="icon-btn" type="button" title="Lock/unlock (Ctrl/⌘+Shift+L)" aria-label="Lock/unlock" aria-pressed="false">🔓</button>
      <button id="close-btn" class="icon-btn danger" type="button" title="Quit" aria-label="Quit">✕</button>
    </div>

    <div class="empty-state" aria-hidden="true">
      <div class="empty-title">Drop an image here</div>
      <div class="empty-subtitle">or click 🖼️ to select</div>
    </div>

    <img id="watermark-image" src="" alt="Watermark" />
    <div id="locked-badge" class="locked-badge" aria-hidden="true">Locked · Ctrl/⌘+Shift+L</div>
    <div id="resize-handle" aria-label="Resize" title="Resize"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
